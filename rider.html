<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strink Driver | Partner</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { darkbg: '#050505', cardbg: '#121212', accent: '#FACC15', success: '#10b981', danger: '#ef4444' },
                    boxShadow: { 'neon': '0 0 20px rgba(250, 204, 21, 0.3)' }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; background-color: #050505; }
        .otp-digit { background: #333; color: white; border: 1px solid #444; border-radius: 8px; font-size: 1.5rem; text-align: center; width: 3rem; height: 3.5rem; }
        .otp-digit:focus { border-color: #FACC15; outline: none; background: #222; }
    </style>
</head>
<body class="text-gray-100 h-[100dvh] w-screen overflow-hidden flex flex-col bg-darkbg">

    <div class="px-6 py-4 flex justify-between items-center border-b border-white/10 bg-[#121212]">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gray-800 border border-gray-600 flex items-center justify-center"><i class="fas fa-user text-gray-400"></i></div>
            <div><h3 class="font-bold text-sm">Raju Bhai</h3><div class="flex items-center text-[10px] gap-1 text-gray-400"><i class="fas fa-star text-yellow-500"></i> 4.9 • GJ06 AA 1111</div></div>
        </div>
        <div class="bg-gray-800 px-3 py-1 rounded-full border border-gray-700"><span class="text-xs font-mono font-bold text-accent">₹450.00</span></div>
    </div>

    <div class="flex-1 flex flex-col items-center justify-center relative p-6">
        
        <div id="status-display" class="text-center z-10 transition-all duration-500">
            <div class="relative w-40 h-40 flex items-center justify-center mx-auto mb-6">
                <div class="absolute inset-0 bg-accent rounded-full opacity-20 animate-ping"></div>
                <div class="w-24 h-24 bg-[#121212] rounded-full border-2 border-accent flex items-center justify-center shadow-neon">
                    <i class="fas fa-wifi text-accent text-3xl"></i>
                </div>
            </div>
            <h1 class="text-2xl font-bold text-white">You are Online</h1>
            <p class="text-gray-500 mt-2 text-sm">Waiting for ride requests...</p>
        </div>

        <div id="otp-view" class="hidden w-full max-w-sm text-center animate-fade-in">
            <div class="bg-[#1a1a1a] border border-gray-700 rounded-2xl p-6 shadow-2xl">
                <div class="mb-6">
                    <p class="text-xs text-gray-500 uppercase font-bold tracking-widest mb-1">Picking Up</p>
                    <h2 id="otp-passenger-name" class="text-2xl font-bold text-white">...</h2>
                    
                    <a id="btn-call-passenger" href="#" class="mt-3 flex items-center justify-center gap-2 py-3 rounded-xl font-bold text-sm transition w-full border">
                        </a>
                </div>
                
                <div class="h-[1px] bg-white/10 w-full mb-6"></div>
                <p class="text-gray-400 text-sm mb-4">Enter Start OTP</p>
                <div class="flex justify-center gap-3 mb-6">
                    <input type="tel" maxlength="1" class="otp-digit" oninput="focusNext(this)">
                    <input type="tel" maxlength="1" class="otp-digit" oninput="focusNext(this)">
                    <input type="tel" maxlength="1" class="otp-digit" oninput="focusNext(this)">
                    <input type="tel" maxlength="1" class="otp-digit" oninput="focusNext(this)">
                </div>
                <button onclick="verifyRideOtp()" class="w-full bg-success hover:bg-green-500 text-black font-bold py-4 rounded-xl shadow-lg transition transform active:scale-95 text-lg">Start Ride <i class="fas fa-play ml-2"></i></button>
            </div>
        </div>

        <div id="ride-active-view" class="hidden text-center w-full animate-fade-in">
            <div class="w-24 h-24 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6 text-green-500 text-4xl border-2 border-green-500 shadow-lg animate-pulse">
                <i class="fas fa-location-arrow"></i>
            </div>
            <h2 class="text-3xl font-bold text-white mb-2">Ride in Progress</h2>
            <p class="text-gray-500 mb-8">Dropping at <span id="drop-loc" class="text-white font-bold">...</span></p>
            <button onclick="completeRide()" class="w-full py-4 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-neon-red transition">End Ride & Collect Cash</button>
        </div>
    </div>

    <div id="order-modal" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col justify-end pb-safe-bottom">
        <div class="bg-[#1a1a1a] border-t border-accent rounded-t-3xl p-6 shadow-[0_-10px_50px_rgba(250,204,21,0.2)] animate-slide-up relative">
            <div class="absolute top-0 left-0 h-1.5 bg-accent w-full animate-[width_15s_linear_forwards]"></div>
            <div class="flex justify-between items-start mb-6">
                <div><h3 class="text-white font-bold text-2xl">New Request</h3><p id="passenger-info" class="text-gray-400 text-xs mt-1 font-mono">...</p></div>
                <div class="bg-gray-800 px-3 py-2 rounded-lg border border-gray-700"><span class="text-xl font-bold text-success">₹45</span></div>
            </div>
            <div class="bg-black/40 rounded-xl p-4 border border-white/5 space-y-3 mb-6">
                <div class="flex items-center gap-3"><div class="w-2 h-2 rounded-full bg-accent"></div><div><p class="text-[10px] text-gray-500 font-bold uppercase">Pickup</p><p id="req-pickup" class="text-white text-sm font-medium">...</p></div></div>
                <div class="flex items-center gap-3"><div class="w-2 h-2 rounded-sm border border-gray-500"></div><div><p class="text-[10px] text-gray-500 font-bold uppercase">Drop</p><p id="req-drop" class="text-white text-sm font-medium">...</p></div></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="document.getElementById('order-modal').classList.add('hidden')" class="py-4 bg-gray-800 rounded-xl font-bold text-gray-400 hover:bg-gray-700 transition">Decline</button>
                <button id="accept-btn" class="py-4 bg-accent hover:bg-accentHover text-black rounded-xl font-bold text-lg shadow-neon transition active:scale-95">Accept Ride</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEwuXdyS6swZgF7n-pNW4mjAklOfpz9F0",
            authDomain: "strinkride.firebaseapp.com",
            databaseURL: "https://strinkride-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "strinkride",
            storageBucket: "strinkride.firebasestorage.app",
            messagingSenderId: "799159533866",
            appId: "1:799159533866:web:08c0ec5a55c765c4fc1e53",
            measurementId: "G-B0BTLXMXDT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const RIDE_ID = "hackathon_demo_ride";
        let currentRideOTP = null;

        const modal = document.getElementById('order-modal');
        const statusDisplay = document.getElementById('status-display');
        const otpView = document.getElementById('otp-view');
        const rideActiveView = document.getElementById('ride-active-view');

        onValue(ref(db, 'rides/' + RIDE_ID), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // --- CALL BUTTON LOGIC ---
            const btn = document.getElementById('btn-call-passenger');
            if(data.passengerPhone) {
                // User allowed sharing
                btn.href = `tel:${data.passengerPhone}`;
                btn.innerHTML = `<i class="fas fa-phone-alt"></i> Call Passenger`;
                btn.className = "mt-3 flex items-center justify-center gap-2 py-3 rounded-xl font-bold text-sm transition w-full bg-green-500/10 hover:bg-green-500/20 text-green-500 border border-green-500/30";
                btn.style.pointerEvents = "auto";
            } else {
                // User denied sharing
                btn.removeAttribute('href');
                btn.innerHTML = `<i class="fas fa-user-secret"></i> Number Private`;
                btn.className = "mt-3 flex items-center justify-center gap-2 py-3 rounded-xl font-bold text-sm transition w-full bg-gray-800 text-gray-500 border border-gray-700 cursor-not-allowed opacity-50";
                btn.style.pointerEvents = "none";
            }

            if(data.otp) currentRideOTP = data.otp;
            if(data.passengerName) {
                document.getElementById('passenger-info').innerText = `Passenger: ${data.passengerName}`;
                document.getElementById('otp-passenger-name').innerText = data.passengerName;
            }

            // --- STATE MANAGEMENT ---
            if (data.status === 'pending') {
                document.getElementById('req-pickup').innerText = data.pickup;
                document.getElementById('req-drop').innerText = data.drop;
                if(data.passengerName) document.getElementById('drop-loc').innerText = data.drop;
                
                statusDisplay.classList.add('opacity-30', 'blur-sm');
                modal.classList.remove('hidden');
                otpView.classList.add('hidden');
                rideActiveView.classList.add('hidden');
            } 
            else if (data.status === 'accepted') {
                modal.classList.add('hidden');
                statusDisplay.classList.add('hidden');
                otpView.classList.remove('hidden'); // Show Call Button Here
                rideActiveView.classList.add('hidden');
            }
            else if (data.status === 'started') {
                if(data.drop) document.getElementById('drop-loc').innerText = data.drop;
                modal.classList.add('hidden');
                statusDisplay.classList.add('hidden');
                otpView.classList.add('hidden'); // HIDE OTP View (Hides Call Button)
                rideActiveView.classList.remove('hidden'); // Show Ride View
            }
            else {
                // Completed/Idle
                modal.classList.add('hidden');
                statusDisplay.classList.remove('hidden', 'opacity-30', 'blur-sm');
                otpView.classList.add('hidden');
                rideActiveView.classList.add('hidden');
            }
        });

        document.getElementById('accept-btn').addEventListener('click', () => {
            update(ref(db, 'rides/' + RIDE_ID), {
                status: 'accepted',
                driverName: "Raju Bhai",
                driverVehicle: "Auto (GJ06 AA 1111)",
                driverPhone: "+919876543210" // Driver Always Shares Number
            });
        });

        window.verifyRideOtp = function() {
            let enteredOtp = "";
            document.querySelectorAll('.otp-digit').forEach(input => enteredOtp += input.value);
            if(enteredOtp == currentRideOTP) {
                update(ref(db, 'rides/' + RIDE_ID), { status: 'started' });
            } else {
                alert("Wrong OTP! Ask passenger.");
                document.querySelectorAll('.otp-digit').forEach(input => input.value = "");
            }
        }

        window.completeRide = function() {
            update(ref(db, 'rides/' + RIDE_ID), { status: 'completed' });
            alert("Ride Completed! Cash Collected: ₹45");
            setTimeout(() => location.reload(), 1000);
        }

        window.focusNext = function(el) { 
            if (el.value.length === 1 && el.nextElementSibling) el.nextElementSibling.focus(); 
        }
    </script>
</body>
</html>
